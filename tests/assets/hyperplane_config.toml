[dataset]
    name      = "test_hyperplane"
    type      = "synthetic"
    source    = "capymoa"
    generator = "HyperplaneGenerator"

[metadata]
    dimension = "multivariate"
    labeling  = "supervised"
    n_classes = 2

[[features]]
    name = "feature_0"
    type = "continuous"
    role = "feature"

[[features]]
    name = "feature_1"
    type = "continuous"
    role = "feature"

[[features]]
    name = "feature_2"
    type = "continuous"
    role = "feature"

[[features]]
    name = "feature_3"
    type = "continuous"
    role = "feature"

[[features]]
    name = "feature_4"
    type = "continuous"
    role = "feature"

[[features]]
    name = "feature_5"
    type = "continuous"
    role = "feature"

[[features]]
    name = "feature_6"
    type = "continuous"
    role = "feature"

[[features]]
    name = "feature_7"
    type = "continuous"
    role = "feature"

[[features]]
    name = "feature_8"
    type = "continuous"
    role = "feature"

[[features]]
    name = "feature_9"
    type = "continuous"
    role = "feature"

[[features]]
    name = "target"
    type = "categorical"
    role = "target"

[generator_config]
    n_instances = 1000
    n_features  = 10
    random_seed = 42

[drift_config]
    drift_points   = [500]
    drift_types    = ["concept"]
    drift_patterns = ["gradual"]
