[dataset]
    name      = "test_hyperplane_research_params"
    type      = "synthetic"
    source    = "capymoa"
    generator = "HyperplaneGenerator"

[metadata]
    dimension = "multivariate"
    labeling  = "supervised"
    n_classes = 2

[[features]]
    name = "feature_0"
    type = "continuous"
    role = "feature"

[[features]]
    name = "feature_1"
    type = "continuous"
    role = "feature"

[[features]]
    name = "feature_2"
    type = "continuous"
    role = "feature"

[[features]]
    name = "target"
    type = "categorical"
    role = "target"

[generator_config]
    n_instances = 1000
    n_features  = 3
    random_seed = 42

[drift_config]
    drift_points         = [300, 600]
    drift_types          = ["concept", "concept"]
    drift_patterns       = ["gradual", "abrupt"]
    transition_durations = [100, 0]
    drift_intensities    = [0.5, 0.8]
    affected_features    = [[0, 1], [2]]
