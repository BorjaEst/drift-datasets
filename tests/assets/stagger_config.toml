[dataset]
    name      = "test_stagger"
    type      = "synthetic"
    source    = "capymoa"
    generator = "STAGGERGenerator"

[metadata]
    dimension = "multivariate"
    labeling  = "supervised"
    n_classes = 2

[[features]]
    name = "feature_0"
    type = "continuous"
    role = "feature"

[[features]]
    name = "feature_1"
    type = "continuous"
    role = "feature"

[[features]]
    name = "target"
    type = "categorical"
    role = "target"

[generator_config]
    n_instances   = 1000
    concept_index = 1
    random_seed   = 42

[drift_config]
    drift_points   = [333, 666]
    drift_types    = ["concept", "concept"]
    drift_patterns = ["abrupt", "abrupt"]
