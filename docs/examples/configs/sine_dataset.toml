# ExpertSystems Sine Dataset Configuration
# Reproduces the Sine dataset from "A comparative study on concept drift detectors"
# Published in Expert Systems with Applications
#
# Dataset characteristics:
# - 50,000 samples with concept drift at points 10,000, 25,000, and 40,000
# - Binary classification with concept reversal after each drift
# - Two continuous features (x, y) generated from sine and cosine functions
# - Abrupt drift pattern with stable periods between drifts

[dataset]
    name        = "expertsystems_sine"
    type        = "synthetic"
    source      = "capymoa"
    generator   = "SineGenerator"
    description = "Sine dataset from ExpertSystems comparative study with concept reversal at drift points"

[metadata]
    dimension = "multivariate"
    labeling  = "supervised"
    n_classes = 2
    temporal  = true
    task_type = "classification"

# Feature specifications matching the original paper
[[features]]
    name        = "feature_0"
    type        = "continuous"
    role        = "feature"
    description = "X coordinate from sine function"

[[features]]
    name        = "feature_1"
    type        = "continuous"
    role        = "feature"
    description = "Y coordinate from cosine function"

[[features]]
    name        = "target"
    type        = "categorical"
    role        = "target"
    description = "Binary classification target"

# Generator configuration matching ExpertSystems paper
[generator_config]
    n_instances             = 50000
    classification_function = 1
    noise_level             = 0.0 # No noise for cleaner results
    random_seed             = 42

# Drift configuration: 3 concept drifts with reversal
[drift_config]
    drift_points         = [10000, 25000, 40000]
    drift_types          = ["concept", "concept", "concept"]
    drift_patterns       = ["abrupt", "abrupt", "abrupt"]
    concept_reversal     = true
    stable_periods       = true
    transition_durations = [0, 0, 0] # Abrupt changes
    concepts             = ["Original", "Reversed", "Original", "Reversed"]
