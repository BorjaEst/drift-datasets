# ExpertSystems Mixed Dataset Configuration - Mixed(1000)
# Reproduces the Mixed(1000) dataset from "A comparative study on concept drift detectors"
# Published in Expert Systems with Applications
#
# Dataset characteristics:
# - Slow gradual drift configuration similar to SINE1G dataset
# - Each context made up of 2000 instances
# - Slow gradual drift lasts for 1000 instances, between time steps 37-62
# - 2 boolean (v, w) + 2 numerical (x, y) attributes
# - Three verification conditions: v, w, and y < 0.5 + 0.3*sin(3πx)

[dataset]
    name        = "Mixed(1000)"
    type        = "synthetic"
    source      = "capymoa"
    generator   = "SineGenerator" # Base generator for mixed patterns
    description = "Mixed(1000) dataset similar to SINE1G with 1000 instances transition from ExpertSystems study"

[metadata]
    dimension = "multivariate"
    labeling  = "supervised"
    n_classes = 2
    temporal  = true
    task_type = "classification"

# Mixed dataset features: 2 boolean + 2 numerical
[[features]]
    name        = "v"
    type        = "categorical"
    role        = "feature"
    description = "Boolean attribute v"

[[features]]
    name        = "w"
    type        = "categorical"
    role        = "feature"
    description = "Boolean attribute w"

[[features]]
    name        = "x"
    type        = "continuous"
    role        = "feature"
    description = "Numerical attribute x"

[[features]]
    name        = "y"
    type        = "continuous"
    role        = "feature"
    description = "Numerical attribute y"

[[features]]
    name        = "target"
    type        = "categorical"
    role        = "target"
    description = "Binary classification target"

# Generator configuration for Mixed(1000) - similar to SINE1G
[generator_config]
    n_instances             = 4000 # 2 contexts × 2000 instances each
    classification_function = 1
    noise_level             = 0.0 # Noise-free dataset
    random_seed             = 42

# Mixed(1000) drift configuration: 1000 instances transition between steps 37-62
[drift_config]
    drift_points         = [2000]
    drift_types          = ["concept"]
    drift_patterns       = ["gradual"]
    transition_durations = [1000] # 1000 instances transition width
    stable_periods       = true
    intermittent_drift   = true
    concept_reversal     = true # Classification is reversed when drift occurs
