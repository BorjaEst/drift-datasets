# ExpertSystems Mixed Dataset Configuration
# Reproduces the Mixed dataset from "A comparative study on concept drift detectors"
# Published in Expert Systems with Applications
#
# Dataset characteristics:
# - Intermittent gradual drift with stable periods
# - Combines periods of stability with gradual transitions
# - 4 attributes with balanced classes
# - Noise injection during drift periods

[dataset]
    name        = "expertsystems_mixed"
    type        = "synthetic"
    source      = "capymoa"
    generator   = "SineGenerator" # Base generator for mixed patterns
    description = "Mixed dataset from ExpertSystems study with intermittent gradual drift and stable periods"

[metadata]
    dimension = "multivariate"
    labeling  = "supervised"
    n_classes = 2
    temporal  = true
    task_type = "classification"

# Mixed dataset features
[[features]]
    name        = "feature_0"
    type        = "continuous"
    role        = "feature"
    description = "Primary feature component"

[[features]]
    name        = "feature_1"
    type        = "continuous"
    role        = "feature"
    description = "Secondary feature component"

[[features]]
    name        = "target"
    type        = "categorical"
    role        = "target"
    description = "Binary classification target"

# Generator configuration for mixed patterns
[generator_config]
    n_instances             = 60000
    classification_function = 1
    noise_level             = 0.1 # Some noise for mixed patterns
    random_seed             = 42

# Mixed drift configuration: alternating stable and drift periods
[drift_config]
    drift_points         = [15000, 30000, 45000]
    drift_types          = ["concept", "prior", "concept"]
    drift_patterns       = ["gradual", "gradual", "gradual"]
    transition_durations = [5000, 3000, 5000] # Gradual transitions
    stable_periods       = true
    intermittent_drift   = true
    concepts             = ["Stable_1", "Drift_1", "Stable_2", "Drift_2"]
