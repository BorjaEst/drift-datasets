# ExpertSystems Hyperplane Dataset Configuration - Fast Rotation
# Reproduces the Hyperplane Hyp(0.1) dataset from "A comparative study on concept drift detectors"
# Published in Expert Systems with Applications
#
# Dataset characteristics:
# - 100,000 samples with continuous gradual drift (fast rotation)
# - Binary classification in 10-dimensional space
# - All 10 dimensions affected by drift (rotation)
# - 5% noise injection
# - No stable periods (continuous drift throughout)

[dataset]
    name        = "Hyp(0.1)"
    type        = "synthetic"
    source      = "capymoa"
    generator   = "HyperplaneGenerator"
    description = "Fast rotating hyperplane Hyp(0.1) from ExpertSystems study with continuous gradual drift"

[metadata]
    dimension = "multivariate"
    labeling  = "supervised"
    n_classes = 2
    temporal  = true
    task_type = "classification"

# 10-dimensional feature space (all continuous)
[[features]]
    name = "feature_0"
    type = "continuous"
    role = "feature"

[[features]]
    name = "feature_1"
    type = "continuous"
    role = "feature"

[[features]]
    name = "feature_2"
    type = "continuous"
    role = "feature"

[[features]]
    name = "feature_3"
    type = "continuous"
    role = "feature"

[[features]]
    name = "feature_4"
    type = "continuous"
    role = "feature"

[[features]]
    name = "feature_5"
    type = "continuous"
    role = "feature"

[[features]]
    name = "feature_6"
    type = "continuous"
    role = "feature"

[[features]]
    name = "feature_7"
    type = "continuous"
    role = "feature"

[[features]]
    name = "feature_8"
    type = "continuous"
    role = "feature"

[[features]]
    name = "feature_9"
    type = "continuous"
    role = "feature"

[[features]]
    name        = "target"
    type        = "categorical"
    role        = "target"
    description = "Binary classification target"

# Generator configuration for Hyp(0.1) - fast rotation hyperplane
[generator_config]
    n_instances = 100000 # 100,000 instances as specified
    n_features  = 10 # 10 drifting attributes
    noise_level = 0.05 # 5% noise
    random_seed = 42

# Continuous gradual drift configuration - rotation speed 0.1
[drift_config]
    drift_points     = [] # No discrete drift points - continuous rotation
    drift_patterns   = ["continuous_gradual"]
    drift_types      = ["concept"]
    continuous_drift = true
    rotation_speed   = 0.1 # Fast rotation as specified
    stable_periods   = false # Always changing
