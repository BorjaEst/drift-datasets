# Research Configuration for Academic Studies

# This configuration is designed for academic research requiring rigorous
# reproducibility, comprehensive metadata, and standardized evaluation protocols.
# Suitable for comparative studies and publication-quality results.

[dataset]
    name        = "academic_research_benchmark"
    type        = "mixed"
    description = "Research-grade dataset for academic drift detection evaluation"
    version     = "2.1.0"
    license     = "CC-BY-4.0"
    doi         = "10.example/drift-datasets.academic.2025"

[metadata]
    dimension          = "multivariate"
    labeling           = "supervised"
    n_classes          = 3
    temporal           = true
    domain             = "academic_research"
    complexity         = "medium"
    evaluation_purpose = "comparative_study"

# Research metadata
[research]
    study_title            = "Comparative Analysis of Concept Drift Detection Methods"
    principal_investigator = "Dr. Research Example"
    institution            = "Example University"
    contact                = "research@example.edu"
    funding_source         = "Research Grant #12345"
    ethics_approval        = "IRB-2025-001"
    publication_intent     = true

# Reproducibility requirements
[reproducibility]
    random_seed              = 12345
    version_control          = true
    parameter_logging        = true
    environment_snapshot     = true
    deterministic_generation = true

# Base real-world dataset
[real_world_base]
    source           = "ucimlrepo"
    dataset_id       = 267 # Banknote Authentication Dataset
    preprocessing    = "standard"
    train_test_split = false # Keep as single stream
    validation_split = 0.0

# Feature configuration for research standards
[[features]]
    name             = "variance"
    type             = "continuous"
    role             = "feature"
    description      = "Variance of Wavelet Transformed image"
    measurement_unit = "normalized"
    expected_range   = [-7.0, 7.0]

[[features]]
    name             = "skewness"
    type             = "continuous"
    role             = "feature"
    description      = "Skewness of Wavelet Transformed image"
    measurement_unit = "normalized"
    expected_range   = [-13.0, 13.0]

[[features]]
    name             = "curtosis"
    type             = "continuous"
    role             = "feature"
    description      = "Curtosis of Wavelet Transformed image"
    measurement_unit = "normalized"
    expected_range   = [-5.0, 17.0]

[[features]]
    name             = "entropy"
    type             = "continuous"
    role             = "feature"
    description      = "Entropy of image"
    measurement_unit = "normalized"
    expected_range   = [-8.0, 3.0]

[[features]]
    name        = "class"
    type        = "categorical"
    role        = "target"
    description = "Banknote authenticity classification"
    classes     = ["authentic", "counterfeit"]

# Research-oriented drift injection
[drift_config]
    drift_points   = [400, 800, 1200] # Based on dataset size analysis
    drift_types    = ["concept", "covariate", "prior"]
    drift_patterns = ["abrupt", "gradual", "abrupt"]

    # Academic evaluation requirements
    drift_magnitude_levels   = [0.3, 0.5, 0.3] # Controlled intensity levels
    statistical_significance = 0.05
    effect_size_calculation  = "cohen_d"
    power_analysis           = true

# Detailed drift event specifications
[[academic_drift_events]]
    event_id           = 1
    drift_point        = 400
    type               = "concept"
    pattern            = "abrupt"
    description        = "Abrupt concept drift simulating sudden change in counterfeit techniques"
    justification      = "Real-world scenario where new counterfeiting methods emerge suddenly"
    affected_features  = ["variance", "skewness"]
    pre_drift_concept  = "linear_boundary"
    post_drift_concept = "quadratic_boundary"

[[academic_drift_events]]
    event_id            = 2
    drift_point         = 800
    type                = "covariate"
    pattern             = "gradual"
    description         = "Gradual covariate shift representing scanner calibration drift"
    justification       = "Common real-world scenario in automated systems"
    affected_features   = ["curtosis", "entropy"]
    transition_duration = 100
    shift_model         = "linear"

[[academic_drift_events]]
    event_id                  = 3
    drift_point               = 1200
    type                      = "prior"
    pattern                   = "abrupt"
    description               = "Prior probability shift due to sampling bias changes"
    justification             = "Change in population distribution of authentic vs counterfeit notes"
    class_distribution_before = [0.6, 0.4]
    class_distribution_after  = [0.3, 0.7]

# Evaluation protocols for academic rigor
[evaluation]
    protocol            = "prequential" # Prequential evaluation for time-series data
    window_sizes        = [50, 100, 200]
    sliding_window      = true
    performance_metrics = ["accuracy", "precision", "recall", "f1_score", "auc"]

# Statistical testing requirements
[statistical_testing]
    significance_tests             = ["mcnemar", "wilcoxon_signed_rank", "friedman"]
    multiple_comparison_correction = "bonferroni"
    confidence_level               = 0.95
    bootstrap_iterations           = 1000

# Drift detection evaluation
[drift_detection_evaluation]
    detection_delay_tolerance     = 50 # Maximum acceptable detection delay
    false_positive_rate_threshold = 0.05
    false_negative_rate_threshold = 0.10
    evaluation_metrics            = ["detection_accuracy", "detection_delay", "false_alarm_rate"]

# Ground truth and annotation
[ground_truth]
    concept_annotations        = true
    drift_annotations          = true
    statistical_annotations    = true
    temporal_annotations       = true
    uncertainty_quantification = true

# Data quality and validation
[quality_assurance]
    data_validation            = true
    drift_validation           = true
    metadata_validation        = true
    reproducibility_validation = true

    # Quality checks
    outlier_detection_method = "isolation_forest"
    outlier_threshold        = 0.05
    missing_value_strategy   = "none" # No missing values expected
    data_integrity_checks    = ["range_validation", "type_validation", "consistency_checks"]

# Publication and sharing requirements
[publication]
    dataset_description_paper = true
    methodology_documentation = true
    code_availability         = true
    data_availability         = "open_access"
    supplementary_materials   = true

    # Citation requirements
    citation_format          = "bibtex"
    license_compliance       = true
    attribution_requirements = "full"

# Academic collaboration
[collaboration]
    data_sharing_agreement   = "standard_academic"
    reproducibility_package  = true
    replication_instructions = true
    contact_information      = true

# Export formats for academic use
[export]
    primary_format           = "csv"
    metadata_format          = "json"
    additional_formats       = ["arff", "matlab", "r_data"]
    include_timestamps       = true
    include_concept_labels   = true
    include_drift_indicators = true

# Documentation requirements
[documentation]
    methodology_description = "complete"
    parameter_justification = "required"
    limitation_discussion   = "required"
    future_work_suggestions = true

# Version control and tracking
[versioning]
    major_version          = 2
    minor_version          = 1
    patch_version          = 0
    release_notes          = "Enhanced academic features and validation"
    changelog              = "Available in CHANGELOG.md"
    backward_compatibility = true
